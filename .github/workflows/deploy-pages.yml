name: Deploy Soudache 3D QC Viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: soudache-qc-viewer-pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build integrity-verified public site
        run: python3 scripts/build_public_viewer.py --output .site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validation dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Validate 13 assets and controls locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory .site > /tmp/qc-viewer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node scripts/validate_qc_viewer.mjs --base-url=http://127.0.0.1:4173/ --mode=local
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validation dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Validate 13 deployed assets, controls, and mobile viewport
        env:
          VIEWER_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/validate_qc_viewer.mjs --base-url="$VIEWER_URL" --mode=remote


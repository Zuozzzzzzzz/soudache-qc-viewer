name: Seed immutable QC asset bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed-asset-bundle.yml

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download authenticated source artifact through one-time bridge
        run: |
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprwestus.oaiusercontent.com/files/00000000-e0c8-8230-995a-4ad2936b3ecb/raw?se=2026-09-18T08%3A53%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b39f-478c-77a8-8531-8a76deef1c1c&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A20%3A46Z&ske=2026-09-19T06%3A20%3A46Z&sks=b&skv=2026-02-06&sig=TpyTMN/p5hh9P9Q%2BkQMSJpPZbBvSt5aKkMsEv9t4ncA%3D' --output soudache-qc-viewer-pages.zip
      - name: Verify bundle identity and contents
        shell: bash
        run: |
          set -euo pipefail
          echo "29e537050ee872e4c8c60f4ba2ab25bfbd55d46a046199f877b2c5fba30483ce  soudache-qc-viewer-pages.zip" | sha256sum --check
          unzip -t soudache-qc-viewer-pages.zip
      - name: Publish immutable public QC delivery bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create asset-bundle-v1 soudache-qc-viewer-pages.zip \
            --title "Soudache QC asset bundle v1" \
            --notes "Integrity-verified public QC delivery bundle. Production source of truth: private soudache-content commit 176588265b8a170d54910e9686d35a65bef3c10a. Credits: 0." \
            --latest=false
